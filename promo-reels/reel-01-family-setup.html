<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel 01 – Family Setup Workflow (15s, 9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@500;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0b0b1a; overflow: hidden; }
  body { font-family: 'Poppins', 'Noto Sans Malayalam', 'Nirmala UI', system-ui, sans-serif; }
  .ml { font-family: 'Noto Sans Malayalam', 'Nirmala UI', 'Poppins', sans-serif; }

  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    width: 540px; height: 960px; position: relative; overflow: hidden; flex: none;
    background: linear-gradient(160deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
    transform-origin: center center;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .45; }
  .b1 { width: 300px; height: 300px; background: #22d3ee; top: -80px; left: -90px; animation: drift 6s ease-in-out infinite alternate; }
  .b2 { width: 320px; height: 320px; background: #facc15; bottom: -110px; right: -120px; opacity: .3; animation: drift 7s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(40px, 30px) scale(1.1); } }

  /* ---------- Workflow strip ---------- */
  #flow { position: absolute; top: 26px; left: 18px; right: 18px; display: flex; align-items: flex-start; z-index: 5; }
  .fs { flex: 1; text-align: center; color: #fff; opacity: 0; transform: translateY(-14px); transition: opacity .4s, transform .4s; }
  #flow.show .fs { opacity: .55; transform: none; }
  #flow.show .fs:nth-child(3) { transition-delay: .15s; }
  #flow.show .fs:nth-child(5) { transition-delay: .3s; }
  #flow.show .fs:nth-child(7) { transition-delay: .45s; }
  .fs .dot { width: 46px; height: 46px; margin: 0 auto 6px; border-radius: 50%; background: rgba(255,255,255,.2);
    border: 2px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; font-size: 21px; transition: all .35s; }
  .fs .lb { font-size: 11.5px; font-weight: 700; line-height: 1.25; }
  #flow.show .fs.on { opacity: 1; }
  .fs.on .dot { background: #fff; border-color: #fff; transform: scale(1.18); box-shadow: 0 0 0 6px rgba(255,255,255,.25), 0 0 24px rgba(255,255,255,.7); }
  #flow.show .fs.done { opacity: .95; }
  .fs.done .dot { background: #22c55e; border-color: #bbf7d0; }
  .ln { flex: 0 0 18px; height: 3px; margin-top: 22px; background: rgba(255,255,255,.25); border-radius: 3px; transition: background .4s; }
  .ln.on { background: #fff; }

  /* ---------- Phone ---------- */
  #phone { position: absolute; left: 50%; top: 126px; width: 318px; height: 620px; margin-left: -159px;
    background: #0f0f17; border-radius: 46px; padding: 10px; z-index: 4;
    box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 0 0 2px #2a2a3a;
    opacity: 0; transform: translateY(60px) scale(.92); transition: opacity .5s, transform .6s cubic-bezier(.34,1.4,.64,1); }
  #phone.show { opacity: 1; transform: none; }
  .notch { position: absolute; top: 18px; left: 50%; width: 92px; height: 24px; margin-left: -46px; background: #0f0f17; border-radius: 20px; z-index: 30; }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 36px; background: #f4f6fb; overflow: hidden; }

  .scr { position: absolute; inset: 0; padding: 48px 15px 15px; opacity: 0; transform: translateX(40px); transition: opacity .4s, transform .4s; }
  .scr.show { opacity: 1; transform: none; }
  .scr.out { opacity: 0; transform: translateX(-40px); }

  .app-h { text-align: center; margin-bottom: 10px; }
  .logo { font-weight: 800; color: #3730a3; font-size: 16px; }
  .sub { font-size: 9.5px; color: #64748b; margin-top: 2px; }
  .tabs { display: flex; background: #e2e8f0; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .tab { flex: 1; text-align: center; padding: 7px 0; font-size: 11.5px; border-radius: 8px; color: #475569; font-weight: 600; }
  .tab.on { background: #fff; color: #4338ca; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 4px 16px rgba(15,23,42,.08); }
  .lbl { font-size: 12px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
  .hint-s { font-size: 9.5px; color: #64748b; margin-top: 6px; text-align: center; }
  .input { height: 48px; border: 2px solid #c7d2fe; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; letter-spacing: 4px; font-weight: 800; color: #1e1b4b; background: #f8fafc; transition: all .2s; }
  .input.focus, .fi.focus { border-color: #4f46e5 !important; box-shadow: 0 0 0 4px rgba(79,70,229,.16); }
  .caret { display: none; width: 2px; height: 24px; background: #4f46e5; margin-left: 3px; animation: blink 1s steps(1) infinite; }
  .focus .caret { display: inline-block; }
  @keyframes blink { 50% { opacity: 0; } }
  .ph { color: #94a3b8; font-weight: 500; font-size: 13px; letter-spacing: 0; }
  .btn { margin-top: 12px; height: 44px; border-radius: 12px; background: #4338ca; color: #fff; font-weight: 700; font-size: 13.5px;
    display: flex; align-items: center; justify-content: center; transition: transform .15s, filter .15s; }
  .btn.green { background: #16a34a; }
  .press { transform: scale(.93) !important; filter: brightness(1.2); }

  .fam { background: linear-gradient(90deg, #ecfdf5, #e0f2fe); border: 1px solid #a7f3d0; border-radius: 12px; padding: 10px 12px;
    display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .fam small { display: block; font-size: 8.5px; color: #047857; font-weight: 800; letter-spacing: 1px; }
  .fam b { font-size: 14px; color: #064e3b; }
  .badge { background: #ede9fe; color: #5b21b6; font-size: 10px; font-weight: 800; padding: 4px 9px; border-radius: 20px; border: 1px solid #c4b5fd; }
  .pop { opacity: 0; transform: scale(.7); transition: opacity .35s, transform .45s cubic-bezier(.34,1.7,.64,1); }
  .pop.in { opacity: 1; transform: none; }

  .profiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 10px 0 12px; }
  .profiles.two { grid-template-columns: repeat(2, 1fr); }
  .pf { position: relative; background: #fff; border: 2px solid #e2e8f0; border-radius: 13px; padding: 10px 3px 8px; text-align: center; transition: all .25s; }
  .pf .av { font-size: 28px; line-height: 1.1; }
  .pf .nm { font-size: 11px; font-weight: 700; color: #0f172a; margin-top: 3px; }
  .pf .meta { font-size: 8px; color: #475569; background: #f1f5f9; border-radius: 8px; padding: 2px 5px; display: inline-block; margin-top: 3px; }
  .pf.sel { border-color: #4f46e5; background: #eef2ff; box-shadow: 0 0 0 3px rgba(79,70,229,.15); transform: scale(1.04); }
  .pf.new { border-color: #22c55e; background: #f0fdf4; animation: glow 1.1s ease-in-out infinite; }
  .pf .rib { position: absolute; top: -9px; right: -6px; background: #22c55e; color: #fff; font-size: 8.5px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,.25), 0 0 22px rgba(34,197,94,.55); } }

  .pins { display: flex; gap: 14px; justify-content: center; padding: 14px 0; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
  .pd { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #c7d2fe; transition: all .15s; }
  .pd.f { background: #4338ca; border-color: #4338ca; transform: scale(1.15); }

  /* dashboard */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .topbar b { font-size: 12.5px; color: #1e1b4b; line-height: 1.2; }
  .topbar small { display: block; font-size: 9px; color: #64748b; font-weight: 500; }
  .addbtn { font-size: 11px; font-weight: 700; color: #4338ca; border: 1.5px solid #4338ca; border-radius: 9px; padding: 7px 9px; background: #fff; transition: transform .15s; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(15,23,42,.06); border-left: 4px solid #6366f1; }
  .kpi .v { font-size: 19px; font-weight: 800; color: #0f172a; }
  .kpi .k { font-size: 9px; color: #64748b; font-weight: 600; }
  .feed-h { font-size: 11px; font-weight: 700; margin: 12px 0 6px; color: #0f172a; }
  .feed { background: #fff; border-radius: 12px; padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; box-shadow: 0 2px 8px rgba(15,23,42,.05); }
  .feed span { font-size: 10.5px; font-weight: 600; color: #334155; }
  .feed i { font-style: normal; font-size: 9.5px; font-weight: 700; color: #fff; background: #16a34a; padding: 4px 8px; border-radius: 8px; }

  #modal { position: absolute; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: flex-end; opacity: 0; transition: opacity .3s; z-index: 10; }
  #modal.open { opacity: 1; }
  .sheet { width: 100%; background: #fff; border-radius: 22px 22px 0 0; padding: 14px 14px 16px; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.9,.3,1); }
  #modal.open .sheet { transform: none; }
  .sheet h4 { font-size: 13.5px; color: #1e1b4b; margin-bottom: 9px; }
  .f { margin-bottom: 7px; }
  .f label { display: block; font-size: 9.5px; font-weight: 700; color: #475569; margin-bottom: 3px; }
  .fi { height: 33px; border: 1.5px solid #cbd5e1; border-radius: 9px; padding: 0 10px; display: flex; align-items: center; font-size: 12.5px; font-weight: 600; color: #0f172a; transition: all .2s; }
  .fi .ph { font-size: 11.5px; }
  .chips, .avs { display: flex; gap: 6px; }
  .chip { flex: 1; text-align: center; padding: 7px 2px; border: 1.5px solid #cbd5e1; border-radius: 9px; font-size: 10.5px; font-weight: 700; color: #334155; transition: all .2s; }
  .chip.on { border-color: #16a34a; background: #f0fdf4; color: #166534; box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
  .chip.hint { border-color: #4f46e5; background: #eef2ff; }
  .avo { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 19px; transition: all .2s; }
  .avo.on { border-color: #4f46e5; background: #eef2ff; transform: scale(1.15); }
  .toast { position: absolute; top: 46px; left: 14px; right: 14px; background: #16a34a; color: #fff; border-radius: 12px; padding: 10px 12px; font-size: 12px; font-weight: 700;
    transform: translateY(-160%); transition: transform .4s cubic-bezier(.34,1.5,.64,1); z-index: 20; box-shadow: 0 8px 20px rgba(22,163,74,.35); }
  .toast.in { transform: none; }

  /* tap cursor */
  #finger { position: absolute; left: 150px; top: 640px; width: 34px; height: 34px; margin: -17px 0 0 -17px; z-index: 25; opacity: 0; pointer-events: none;
    transition: left .32s cubic-bezier(.4,0,.2,1), top .32s cubic-bezier(.4,0,.2,1), opacity .25s; }
  #finger .core { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.75); border: 3px solid rgba(79,70,229,.95); box-shadow: 0 4px 12px rgba(0,0,0,.3); transition: transform .12s; }
  #finger .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #6366f1; opacity: 0; }
  #finger.tap .core { transform: scale(.75); }
  #finger.tap .ring { animation: ripple .5s ease-out; }
  @keyframes ripple { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.4); } }

  /* caption */
  #caption { position: absolute; left: 22px; right: 22px; top: 770px; min-height: 140px; z-index: 6; text-align: center; transition: opacity .18s, transform .18s; }
  #caption.swap { opacity: 0; transform: translateY(8px); }
  .cap-step { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #1e1b4b; background: #facc15; padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; }
  .cap-step:empty { display: none; }
  .cap-text { color: #fff; font-size: 23px; font-weight: 800; line-height: 1.45; text-shadow: 0 3px 12px rgba(0,0,0,.35); }

  /* overlays */
  .overlay { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .45s; padding: 0 30px; }
  .overlay.show { opacity: 1; }
  #hook .em { font-size: 96px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-14px) rotate(-6deg); } }
  #hook h1 { font-size: 40px; line-height: 1.35; font-weight: 800; margin-top: 10px; text-shadow: 0 4px 16px rgba(0,0,0,.3); transform: scale(.6); transition: transform .5s cubic-bezier(.34,1.7,.64,1); }
  #hook.show h1 { transform: none; }
  #hook h1 span { color: #fde047; }
  #hook .pill { margin-top: 18px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4); padding: 8px 18px; border-radius: 30px; font-size: 15px; font-weight: 700; }
  #outro { background: linear-gradient(160deg, rgba(79,70,229,.93), rgba(219,39,119,.93)); }
  #outro .box { background: #fff; color: #1e1b4b; border-radius: 26px; padding: 26px 22px; width: 100%; box-shadow: 0 30px 60px rgba(0,0,0,.35); transform: translateY(40px) scale(.9); transition: transform .55s cubic-bezier(.34,1.5,.64,1); }
  #outro.show .box { transform: none; }
  #outro .lg { font-size: 54px; }
  #outro h2 { font-size: 23px; font-weight: 800; margin-top: 4px; }
  #outro .tag { font-size: 13px; color: #64748b; margin-top: 4px; font-weight: 600; }
  #outro .cta { font-size: 26px; font-weight: 800; color: #db2777; margin: 16px 0 10px; }
  #outro .url { display: inline-block; background: #4338ca; color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 15px; font-weight: 700; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(67,56,202,.2); } }
  #outro .creds { margin-top: 14px; font-size: 12.5px; color: #334155; font-weight: 600; }
  #outro .creds code { background: #ede9fe; color: #5b21b6; padding: 2px 7px; border-radius: 6px; font-weight: 800; }
  #confetti { position: absolute; inset: 0; z-index: 9; pointer-events: none; }

  /* controls (hide with H before recording) */
  #controls { position: fixed; bottom: 10px; left: 10px; z-index: 100; display: flex; gap: 8px; align-items: center; font: 600 12px Poppins, sans-serif; color: #e2e8f0; }
  #controls button { background: #4338ca; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  #controls .k { opacity: .7; }
  #clock { min-width: 52px; background: #1e1b4b; padding: 6px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  body.rec #controls { display: none; }
</style>
</head>
<body>
<div id="controls">
  <button onclick="play()">▶ Play / Replay</button>
  <span id="clock">0.0s</span>
  <span class="k">R = replay · H = hide controls · L = loop</span>
</div>

<div id="wrap"><div id="stage"></div></div>

<template id="tpl">
  <div class="blob b1"></div><div class="blob b2"></div>

  <div id="flow" class="ml">
    <div class="fs" id="fs1"><div class="dot">🔑</div><div class="lb">ഫാമിലി<br>കോഡ്</div></div>
    <div class="ln" id="ln1"></div>
    <div class="fs" id="fs2"><div class="dot">👨‍👩‍👧</div><div class="lb">പാരന്റ്<br>ലോഗിൻ</div></div>
    <div class="ln" id="ln2"></div>
    <div class="fs" id="fs3"><div class="dot">➕</div><div class="lb">കുട്ടിയെ<br>ചേർക്കുക</div></div>
    <div class="ln" id="ln3"></div>
    <div class="fs" id="fs4"><div class="dot">✅</div><div class="lb">റെഡി!</div></div>
  </div>

  <div id="phone"><div class="notch"></div><div id="screen">

    <!-- 1. Family code -->
    <div class="scr" id="sCode">
      <div class="app-h"><div class="logo">📚 Kids Study Tracker</div><div class="sub">Kerala State &amp; CBSE · Study &amp; Rewards Portal</div></div>
      <div class="tabs"><div class="tab on">🔑 Sign In</div><div class="tab">🏡 Register Family</div></div>
      <div class="card">
        <div class="lbl">Enter your Family Code</div>
        <div class="input" id="codeInput"><span id="codeText"><span class="ph">e.g. KIDS101</span></span><span class="caret"></span></div>
        <div class="btn" id="btnCode">Continue →</div>
        <div class="hint-s">🔒 Private workspace for each family</div>
      </div>
      <div class="fam pop" id="famCard"><div><small>FAMILY WORKSPACE</small><b>🏡 Rajeev's Family</b></div><span class="badge">KIDS-101</span></div>
    </div>

    <!-- 2. Parent login -->
    <div class="scr" id="sProfile">
      <div class="fam" style="margin-top:0"><div><small>FAMILY WORKSPACE</small><b>🏡 Rajeev's Family</b></div><span class="badge">KIDS-101</span></div>
      <div class="lbl" style="margin-top:12px">Select Profile to Sign In</div>
      <div class="profiles">
        <div class="pf"><div class="av">👦</div><div class="nm">Arjun</div><div class="meta">Class 7 • Kerala</div></div>
        <div class="pf"><div class="av">👧</div><div class="nm">Meera</div><div class="meta">Class 4 • Kerala</div></div>
        <div class="pf" id="pParent"><div class="av">👨‍👩‍👧</div><div class="nm">Rajeev</div><div class="meta">Parent Admin</div></div>
      </div>
      <div class="lbl">Enter 4-digit PIN for <span id="pinFor">…</span></div>
      <div class="pins"><div class="pd" id="pd0"></div><div class="pd" id="pd1"></div><div class="pd" id="pd2"></div><div class="pd" id="pd3"></div></div>
      <div class="btn" id="btnSignIn">🚀 Sign In</div>
    </div>

    <!-- 3. Parent dashboard + add child -->
    <div class="scr" id="sDash">
      <div class="topbar"><b>Parent Command Center<small>Rajeev's Family</small></b><span class="addbtn" id="btnAdd">➕ Add Child</span></div>
      <div class="kpis">
        <div class="kpi"><div class="v">6</div><div class="k">Tasks Today</div></div>
        <div class="kpi" style="border-color:#16a34a"><div class="v">4</div><div class="k">Approved</div></div>
        <div class="kpi" style="border-color:#f97316"><div class="v">5 🔥</div><div class="k">Best Streak</div></div>
        <div class="kpi" style="border-color:#eab308"><div class="v">120 ⭐</div><div class="k">Points</div></div>
      </div>
      <div class="feed-h">Homework Approval Feed</div>
      <div class="feed"><span>📘 Arjun · Maths</span><i>✅ Approve</i></div>
      <div class="feed"><span>📗 Meera · Malayalam</span><i>✅ Approve</i></div>

      <div id="modal"><div class="sheet">
        <h4>➕ Add Student Profile</h4>
        <div class="f"><label>Full Name</label><div class="fi" id="fName"><span id="fNameText"><span class="ph">e.g. Rahul, Meera</span></span><span class="caret"></span></div></div>
        <div class="f"><label>Class / Standard</label><div class="fi" id="fClass"><span id="fClassText"><span class="ph">Select class ▾</span></span></div></div>
        <div class="f"><label>Curriculum / Syllabus Board</label>
          <div class="chips"><div class="chip" id="chKerala">🌴 Kerala State</div><div class="chip" id="chCBSE">🏛️ CBSE</div></div></div>
        <div class="f"><label>Avatar</label>
          <div class="avs"><div class="avo">👦</div><div class="avo" id="avGirl">👧</div><div class="avo">🧒</div><div class="avo">⭐</div><div class="avo">🚀</div></div></div>
        <div class="f"><label>4-digit PIN</label><div class="fi" id="fPin"><span id="fPinText"><span class="ph">e.g. 1234</span></span><span class="caret"></span></div></div>
        <div class="btn green" id="btnSave" style="margin-top:8px;height:38px">💾 Save Profile</div>
      </div></div>
      <div class="toast" id="toast">✅ Ammu added to Rajeev's Family!</div>
    </div>

    <!-- 4. Ready -->
    <div class="scr" id="sDone">
      <div class="fam" style="margin-top:0"><div><small>FAMILY WORKSPACE</small><b>🏡 Rajeev's Family</b></div><span class="badge">KIDS-101</span></div>
      <div class="lbl" style="margin-top:12px">Select Profile to Sign In</div>
      <div class="profiles two">
        <div class="pf"><div class="av">👦</div><div class="nm">Arjun</div><div class="meta">Class 7 • Kerala</div></div>
        <div class="pf"><div class="av">👧</div><div class="nm">Meera</div><div class="meta">Class 4 • Kerala</div></div>
        <div class="pf new"><span class="rib">NEW ✨</span><div class="av">👧</div><div class="nm">Ammu</div><div class="meta">Class 3 • Kerala</div></div>
        <div class="pf"><div class="av">👨‍👩‍👧</div><div class="nm">Rajeev</div><div class="meta">Parent Admin</div></div>
      </div>
      <div class="btn" style="background:#16a34a">🎉 Ammu can now sign in!</div>
    </div>

    <div id="finger"><div class="ring"></div><div class="core"></div></div>
  </div></div>

  <div id="caption" class="ml"><div class="cap-step" id="capStep"></div><div class="cap-text" id="capText"></div></div>

  <div id="hook" class="overlay ml">
    <div class="em">📚</div>
    <h1>മക്കളുടെ പഠനം,<br><span>ഒരൊറ്റ ആപ്പിൽ!</span></h1>
    <div class="pill">⚡ 3 സ്റ്റെപ്പിൽ സെറ്റപ്പ്</div>
  </div>

  <div id="outro" class="overlay ml">
    <div class="box">
      <div class="lg">📚</div>
      <h2>Kids Study &amp; Rewards Tracker</h2>
      <div class="tag">🌴 Kerala State &amp; 🏛️ CBSE · Classes 1–10</div>
      <div class="cta">ഇന്നുതന്നെ ട്രൈ ചെയ്യൂ! 👇</div>
      <div class="url">🔗 kids-study-tracker-demo.web.app</div>
      <div class="creds">Family Code <code>KIDS101</code> · Parent PIN <code>9999</code></div>
    </div>
  </div>

  <canvas id="confetti" width="540" height="960"></canvas>
</template>

<script>
  const W = 540, H = 960, DURATION = 15000;
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  let scale = 1, timers = [], t0 = 0, loop = false, rafClock = 0, confettiRaf = 0;

  function fit() {
    scale = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `scale(${scale})`;
  }
  addEventListener('resize', fit); fit();

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(confettiRaf);
    stage.innerHTML = $('tpl').innerHTML;
  }

  // position relative to #screen, unaffected by transforms/scale
  function posIn(el, anc) {
    let x = 0, y = 0, n = el;
    while (n && n !== anc) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 };
  }
  function moveTo(id) {
    const f = $('finger'), p = posIn($(id), $('screen'));
    f.style.left = p.x + 'px'; f.style.top = p.y + 'px'; f.style.opacity = 1;
  }
  function tap() {
    const f = $('finger'); f.classList.remove('tap'); void f.offsetWidth; f.classList.add('tap');
  }
  function press(id) { const e = $(id); e.classList.add('press'); setTimeout(() => e.classList.remove('press'), 180); }
  function hideFinger() { $('finger').style.opacity = 0; }

  function showScreen(id) {
    document.querySelectorAll('.scr').forEach(s => {
      if (s.id === id) { s.classList.remove('out'); s.classList.add('show'); }
      else if (s.classList.contains('show')) { s.classList.remove('show'); s.classList.add('out'); }
    });
  }
  function flow(n) {
    for (let i = 1; i <= 4; i++) {
      $('fs' + i).classList.toggle('on', i === n);
      $('fs' + i).classList.toggle('done', i < n);
      if (i < 4) $('ln' + i).classList.toggle('on', i < n);
    }
  }
  function setCap(step, text) {
    const c = $('caption'); c.classList.add('swap');
    setTimeout(() => { $('capStep').textContent = step; $('capText').textContent = text; c.classList.remove('swap'); }, 170);
  }
  function type(id, text, start, step) {
    [...text].forEach((_, i) => at(start + i * step, () => { $(id).textContent = text.slice(0, i + 1); }));
  }

  function confetti() {
    const cv = $('confetti'), ctx = cv.getContext('2d');
    const colors = ['#facc15', '#22c55e', '#38bdf8', '#f472b6', '#a78bfa', '#fb923c', '#ffffff'];
    const ps = Array.from({ length: 170 }, () => ({
      x: W / 2 + (Math.random() - .5) * 80, y: 420,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5,
      s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
      c: colors[(Math.random() * colors.length) | 0]
    }));
    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(p => {
        p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (now - start < 3200) confettiRaf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(start);
  }

  function clock() {
    const t = Math.min((performance.now() - t0) / 1000, DURATION / 1000);
    const c = document.getElementById('clock'); if (c) c.textContent = t.toFixed(1) + 's';
    if (t < DURATION / 1000) rafClock = requestAnimationFrame(clock);
  }

  function play() {
    reset(); t0 = performance.now(); cancelAnimationFrame(rafClock); clock();

    /* 0.0 – 2.5s : HOOK */
    at(30, () => { $('hook').classList.add('show'); setCap('', 'മക്കളുടെ പഠനം ട്രാക്ക് ചെയ്യാൻ ഒരു ആപ്പ് വേണോ? 🤔'); });
    at(800, () => $('flow').classList.add('show'));

    /* 2.5 – 5.5s : STEP 1 – Family code */
    at(2500, () => {
      $('hook').classList.remove('show'); $('phone').classList.add('show');
      showScreen('sCode'); flow(1); setCap('STEP 1', 'ആദ്യം ഫാമിലി കോഡ് നൽകുക 🔑');
    });
    at(2950, () => moveTo('codeInput'));
    at(3250, () => { tap(); $('codeInput').classList.add('focus'); $('codeText').textContent = ''; });
    type('codeText', 'KIDS101', 3400, 130);
    at(4300, () => { $('codeInput').classList.remove('focus'); moveTo('btnCode'); });
    at(4650, () => { tap(); press('btnCode'); });
    at(4800, () => $('famCard').classList.add('in'));

    /* 5.5 – 8.0s : STEP 2 – Parent login */
    at(5500, () => { showScreen('sProfile'); flow(2); setCap('STEP 2', 'പാരന്റ് പ്രൊഫൈൽ എടുത്ത് PIN നൽകുക 👨‍👩‍👧'); });
    at(5950, () => moveTo('pParent'));
    at(6250, () => { tap(); $('pParent').classList.add('sel'); $('pinFor').textContent = 'Rajeev'; $('btnSignIn').textContent = '🚀 Sign In as Rajeev'; });
    [0, 1, 2, 3].forEach(i => at(6500 + i * 140, () => $('pd' + i).classList.add('f')));
    at(7100, () => moveTo('btnSignIn'));
    at(7450, () => { tap(); press('btnSignIn'); });

    /* 8.0 – 12.0s : STEP 3 – Add child */
    at(8000, () => { showScreen('sDash'); flow(3); setCap('STEP 3', 'കുട്ടിയുടെ പേരും ക്ലാസും നൽകി, Kerala / CBSE സിലബസ് തിരഞ്ഞെടുക്കാം ➕'); });
    at(8400, () => moveTo('btnAdd'));
    at(8650, () => { tap(); press('btnAdd'); $('modal').classList.add('open'); });
    at(9050, () => moveTo('fName'));
    at(9250, () => { tap(); $('fName').classList.add('focus'); $('fNameText').textContent = ''; });
    type('fNameText', 'Ammu', 9330, 100);
    at(9750, () => { $('fName').classList.remove('focus'); moveTo('fClass'); });
    at(9980, () => { tap(); $('fClassText').textContent = 'Class 3'; });
    at(10120, () => { moveTo('chCBSE'); $('chCBSE').classList.add('hint'); });
    at(10380, () => { $('chCBSE').classList.remove('hint'); moveTo('chKerala'); });
    at(10600, () => { tap(); $('chKerala').classList.add('on'); });
    at(10720, () => moveTo('avGirl'));
    at(10930, () => { tap(); $('avGirl').classList.add('on'); });
    at(11040, () => moveTo('fPin'));
    at(11250, () => { tap(); $('fPinText').textContent = ''; });
    type('fPinText', '••••', 11300, 60);
    at(11500, () => moveTo('btnSave'));
    at(11720, () => { tap(); press('btnSave'); });
    at(11850, () => { $('modal').classList.remove('open'); $('toast').classList.add('in'); hideFinger(); });

    /* 12.2 – 13.8s : STEP 4 – Ready */
    at(12200, () => { showScreen('sDone'); flow(4); setCap('READY ✅', 'റെഡി! കുട്ടിക്ക് ഇനി സ്വന്തം PIN കൊണ്ട് ലോഗിൻ ചെയ്യാം 🎉'); confetti(); });

    /* 13.8 – 15.0s : CTA */
    at(13800, () => { $('outro').classList.add('show'); setCap('', ''); });
    at(DURATION + 600, () => { if (loop) play(); });
  }

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r' || k === ' ') { e.preventDefault(); play(); }
    if (k === 'h') document.body.classList.toggle('rec');
    if (k === 'l') { loop = !loop; }
  });

  reset();
  setTimeout(play, 700);
</script>
</body>
</html>
