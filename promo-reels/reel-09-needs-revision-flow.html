<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel 09 – Needs Revision Workflow with Role Logins (15s 9:16)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@500;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0b0b1a; overflow: hidden; }
  body { font-family: 'Poppins', 'Noto Sans Malayalam', 'Nirmala UI', system-ui, sans-serif; }
  .ml { font-family: 'Noto Sans Malayalam', 'Nirmala UI', 'Poppins', sans-serif; }

  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    width: 540px; height: 960px; position: relative; overflow: hidden; flex: none;
    background: linear-gradient(160deg, #064e3b 0%, #047857 30%, #b45309 70%, #1e1b4b 100%);
    transform-origin: center center;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .4; }
  .b1 { width: 320px; height: 320px; background: #34d399; top: -80px; left: -90px; animation: drift 6s ease-in-out infinite alternate; }
  .b2 { width: 340px; height: 340px; background: #fbbf24; bottom: -110px; right: -120px; opacity: .3; animation: drift 7s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(40px, 30px) scale(1.1); } }

  /* Workflow strip */
  #flow { position: absolute; top: 24px; left: 16px; right: 16px; display: flex; align-items: flex-start; z-index: 10; }
  .fs { flex: 1; text-align: center; color: #fff; opacity: 0; transform: translateY(-14px); transition: opacity .4s, transform .4s; }
  #flow.show .fs { opacity: .55; transform: none; }
  #flow.show .fs:nth-child(3) { transition-delay: .15s; }
  #flow.show .fs:nth-child(5) { transition-delay: .3s; }
  #flow.show .fs:nth-child(7) { transition-delay: .45s; }
  .fs .dot { width: 44px; height: 44px; margin: 0 auto 5px; border-radius: 50%; background: rgba(255,255,255,.18);
    border: 2px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; font-size: 19px; transition: all .35s; }
  .fs .lb { font-size: 10px; font-weight: 700; line-height: 1.25; }
  #flow.show .fs.on { opacity: 1; }
  .fs.on .dot { background: #fff; color: #064e3b; border-color: #fff; transform: scale(1.18); box-shadow: 0 0 0 6px rgba(255,255,255,.25), 0 0 24px rgba(255,255,255,.7); }
  #flow.show .fs.done { opacity: .95; }
  .fs.done .dot { background: #10b981; border-color: #a7f3d0; }
  .ln { flex: 0 0 16px; height: 3px; margin-top: 21px; background: rgba(255,255,255,.25); border-radius: 3px; transition: background .4s; }
  .ln.on { background: #fff; }

  /* Phone */
  #phone {
    position: absolute; left: 50%; top: 122px; width: 320px; height: 626px; margin-left: -160px;
    background: #0f0f17; border-radius: 46px; padding: 10px; z-index: 5;
    box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 2px #2a2a3a;
    opacity: 0; transform: translateY(60px) scale(.92);
    transition: opacity .5s, transform .6s cubic-bezier(.34,1.4,.64,1);
  }
  #phone.show { opacity: 1; transform: none; }
  .notch { position: absolute; top: 18px; left: 50%; width: 92px; height: 24px; margin-left: -46px; background: #0f0f17; border-radius: 20px; z-index: 30; }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 36px; background: #f8fafc; overflow: hidden; padding: 46px 12px 14px; }

  .scr { position: absolute; inset: 0; padding: 46px 12px 14px; display: none; opacity: 0; transform: translateX(30px); transition: opacity .35s, transform .35s; overflow-y: hidden; }
  .scr.active { display: block; opacity: 1; transform: none; }

  /* Profile Switch / Login Common */
  .fam-tag { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 10px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .fam-tag small { font-size: 8px; color: #047857; font-weight: 800; display: block; }
  .fam-tag b { font-size: 11px; color: #064e3b; }
  .profiles-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
  .pf-box { background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 8px 4px; text-align: center; transition: all .2s; }
  .pf-box.selected-child { border-color: #059669; background: #f0fdf4; transform: scale(1.04); box-shadow: 0 0 0 3px rgba(5,150,105,.2); }
  .pf-box.selected-parent { border-color: #d97706; background: #fffbeb; transform: scale(1.04); box-shadow: 0 0 0 3px rgba(217,119,6,.2); }
  .pf-box .av { font-size: 26px; line-height: 1; }
  .pf-box .nm { font-size: 11px; font-weight: 700; color: #0f172a; margin-top: 3px; }
  .pf-box .sub { font-size: 8px; color: #64748b; }
  .pin-row { display: flex; gap: 8px; justify-content: center; padding: 9px 0; background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
  .pin-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #a7f3d0; }
  .pin-dot.filled-green { background: #059669; border-color: #059669; }
  .pin-dot.filled-amber { background: #d97706; border-color: #d97706; }
  .btn-sign { width: 100%; height: 35px; border-radius: 9px; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .btn-sign.green { background: #059669; }
  .btn-sign.amber { background: #d97706; }

  /* Role Bar in screens */
  .role-bar { display: flex; justify-content: space-between; align-items: center; border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; font-weight: 700; }
  .role-bar.child-mode { background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857; }
  .role-bar.parent-mode { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; }
  .role-bar b { font-size: 11px; display: flex; align-items: center; gap: 4px; }
  .role-bar .pill { font-size: 8px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.08); }

  /* Task Card */
  .task-box { background: #fff; border-radius: 14px; padding: 11px; border: 1.5px solid #e2e8f0; box-shadow: 0 3px 8px rgba(0,0,0,.04); margin-bottom: 8px; }
  .task-box-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .task-box-sub { font-size: 8.5px; font-weight: 800; background: #eff6ff; color: #1d4ed8; padding: 2px 6px; border-radius: 4px; }
  .task-box-pts { font-size: 9px; font-weight: 800; color: #d97706; }
  .task-box-title { font-size: 12px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
  .task-box-desc { font-size: 9px; color: #64748b; line-height: 1.35; margin-bottom: 8px; }

  /* Submit Button */
  .btn-action-main {
    width: 100%; height: 36px; border-radius: 10px; background: #047857; color: #fff; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; transition: all .2s;
  }
  .btn-action-main.submitted { background: #0284c7; }
  .btn-action-main.resubmit { background: #d97706; }

  /* Parent Review Controls */
  .review-panel { background: #fff; border: 1.5px solid #fde68a; border-radius: 12px; padding: 10px; margin-top: 8px; box-shadow: 0 4px 12px rgba(217,119,6,.08); }
  .review-title { font-size: 10px; font-weight: 800; color: #92400e; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
  .review-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .btn-rev { height: 34px; border-radius: 8px; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
  .btn-rev.revision { background: #fffbeb; color: #b45309; border: 1.5px solid #f59e0b; }
  .btn-rev.approve { background: #ecfdf5; color: #047857; border: 1.5px solid #10b981; }

  /* Note Box (Popup Card) */
  .note-card { background: #fef3c7; border: 2px solid #d97706; border-radius: 12px; padding: 10px; margin-top: 8px; box-shadow: 0 4px 14px rgba(217,119,6,.2); }
  .note-card-h { font-size: 9.5px; font-weight: 800; color: #92400e; display: flex; justify-content: space-between; margin-bottom: 5px; }
  .note-card-msg { font-size: 11px; font-weight: 800; color: #78350f; line-height: 1.45; background: #ffffff; padding: 8px 10px; border-radius: 8px; border: 1.5px solid #f59e0b; margin-bottom: 8px; }
  .btn-send-note { width: 100%; height: 34px; border-radius: 8px; background: #b45309; color: #ffffff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }

  /* Friendly Child Alert */
  .child-alert {
    background: #fffbeb; border: 2px solid #f59e0b; border-radius: 12px; padding: 10px; margin-bottom: 8px;
    box-shadow: 0 4px 14px rgba(245,158,11,.15);
  }
  .child-alert-h { font-size: 10.5px; font-weight: 800; color: #b45309; display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .child-alert-p { font-size: 9.5px; font-weight: 700; color: #92400e; line-height: 1.4; margin-bottom: 6px; }
  .child-alert-sub { font-size: 8px; color: #78350f; opacity: .85; }

  /* Approval Sticker Popup */
  .praise-modal {
    background: #ecfdf5; border: 2.5px solid #10b981; border-radius: 16px; padding: 14px 10px; text-align: center;
    box-shadow: 0 10px 25px rgba(16,185,129,.2); margin-top: 10px;
  }
  .praise-modal .stk { font-size: 54px; line-height: 1.1; margin-bottom: 4px; animation: pop 0.4s cubic-bezier(.34,1.5,.64,1); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .praise-modal b { font-size: 14px; font-weight: 800; color: #064e3b; display: block; margin: 4px 0 2px; }
  .praise-modal small { font-size: 9.5px; color: #047857; font-weight: 700; }
  .badge-praise-pts { display: inline-block; background: #059669; color: #fff; font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 14px; margin-top: 8px; }

  /* Finger tap */
  #finger { position: absolute; left: 150px; top: 640px; width: 34px; height: 34px; margin: -17px 0 0 -17px; z-index: 60; opacity: 0; pointer-events: none;
    transition: left .32s cubic-bezier(.4,0,.2,1), top .32s cubic-bezier(.4,0,.2,1), opacity .25s; }
  #finger .core { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.8); border: 3px solid rgba(4,120,87,.95); box-shadow: 0 4px 12px rgba(0,0,0,.3); transition: transform .12s; }
  #finger .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #34d399; opacity: 0; }
  #finger.tap .core { transform: scale(.75); }
  #finger.tap .ring { animation: ripple .5s ease-out; }
  @keyframes ripple { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.4); } }
  .press { transform: scale(.94) !important; filter: brightness(1.15); }

  /* Caption */
  #caption { position: absolute; left: 22px; right: 22px; top: 766px; min-height: 140px; z-index: 10; text-align: center; transition: opacity .18s, transform .18s; }
  #caption.swap { opacity: 0; transform: translateY(8px); }
  .cap-step { display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: 2px; color: #064e3b; background: #6ee7b7; padding: 4px 12px; border-radius: 20px; margin-bottom: 7px; }
  .cap-step:empty { display: none; }
  .cap-text { color: #fff; font-size: 22px; font-weight: 800; line-height: 1.45; text-shadow: 0 3px 12px rgba(0,0,0,.4); }

  /* Overlays */
  .overlay { position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .45s; padding: 0 30px; }
  .overlay.show { opacity: 1; }
  #hook .em { font-size: 80px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-12px); } }
  #hook h1 { font-size: 38px; line-height: 1.35; font-weight: 800; margin-top: 10px; text-shadow: 0 4px 16px rgba(0,0,0,.35); transform: scale(.6); transition: transform .5s cubic-bezier(.34,1.7,.64,1); }
  #hook.show h1 { transform: none; }
  #hook h1 span { color: #facc15; }
  #hook .pill { margin-top: 16px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4); padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 700; }

  #outro { background: linear-gradient(160deg, rgba(6,78,59,.95), rgba(180,83,9,.95)); }
  #outro .box { background: #fff; color: #064e3b; border-radius: 24px; padding: 24px 20px; width: 100%; box-shadow: 0 30px 60px rgba(0,0,0,.35); transform: translateY(40px) scale(.9); transition: transform .55s cubic-bezier(.34,1.5,.64,1); }
  #outro.show .box { transform: none; }
  #outro .lg { font-size: 48px; }
  #outro h2 { font-size: 21px; font-weight: 800; margin-top: 4px; }
  #outro .tag { font-size: 12.5px; color: #64748b; margin-top: 3px; font-weight: 600; }
  #outro .cta { font-size: 24px; font-weight: 800; color: #047857; margin: 14px 0 10px; }
  #outro .url { display: inline-block; background: #047857; color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; }

  #confetti { position: absolute; inset: 0; z-index: 15; pointer-events: none; }

  /* Controls */
  #controls { position: fixed; bottom: 10px; left: 10px; z-index: 100; display: flex; gap: 8px; align-items: center; font: 600 12px Poppins, sans-serif; color: #e2e8f0; }
  #controls button { background: #047857; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  #controls .k { opacity: .7; }
  #clock { min-width: 52px; background: #064e3b; padding: 6px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  body.rec #controls { display: none; }
</style>
</head>

<div id="controls">
  <button onclick="play()">▶ Play / Replay</button>
  <span id="clock">0.0s</span>
  <span class="k">R = replay · H = hide controls · L = loop</span>
</div>

<div id="wrap"><div id="stage"></div></div>

<template id="tpl">
  <div class="blob b1"></div><div class="blob b2"></div>

  <div id="flow" class="ml">
    <div class="fs" id="fs1"><div class="dot">🧒</div><div class="lb">ചൈൽഡ്<br>ലോഗിൻ</div></div>
    <div class="ln" id="ln1"></div>

    <div class="ln" id="ln2"></div>

    <div class="ln" id="ln3"></div>

  </div>

  <div id="phone">
    <div class="notch"></div>
    <div id="screen">

      <!-- 1. Child Login Screen -->
      <div class="scr" id="sLoginChild">
        <div class="fam-tag">
          <div><small>WORKSPACE</small><b>🏡 Rajeev's Family</b></div>

          <span style="font-size:9.5px;color:#d97706;font-weight:800;">KIDS-101</span>

          </div>
          <div class="pf-box" id="pfChild2">
            <div class="av">👦</div>
            <div class="nm">Arjun</div>

        </div>

        <div class="task-box">
          <div class="task-box-title">Chapter 3 Exercise (Decimals)</div>
          <div style="font-size:9px;color:#047857;font-weight:800;margin-bottom:8px;">✏️ Q3 Completed &amp; Verified in Notebook!</div>

          <div class="btn-action-main resubmit" id="btnResubmit">
            <span>🚀 Resubmit Corrected Homework (+20)</span>
          </div>
        </div>
      </div>

      <!-- 6. Parent Approved & Super Effort Sticker -->
      <div class="scr" id="sParentApproved">
        <div class="role-bar parent-mode">
          <b>👨‍👩‍👧 Parent Verified &amp; Approved</b>
          <span class="pill">Success</span>
        </div>

        <div class="praise-modal" id="praiseModal">
          <div class="stk">🌟</div>
          <b>Super Effort Arjun!</b>
          <small>തിരുത്തലുകൾ കൃത്യമായി പൂർത്തിയാക്കി! Proud of you!</small>
          <div><span class="badge-praise-pts">⭐ +20 Points Awarded!</span></div>
        </div>

        <div style="background:#fff;border-radius:12px;padding:10px;margin-top:10px;border:1px solid #e2e8f0;text-align:center;">
          <div style="font-size:10.5px;font-weight:800;color:#047857;">🔥 5-Day Study Streak Kept Intact!</div>
          <div style="font-size:8.5px;color:#64748b;margin-top:3px;">നെഗറ്റീവ് മാർക്കുകളില്ല, പഠനത്തിൽ ആത്മവിശ്വാസം മാത്രം! 🚀</div>
        </div>
      </div>

      <div id="finger"><div class="ring"></div><div class="core"></div></div>
    </div>
  </div>

  <div id="caption" class="ml"><div class="cap-step" id="capStep"></div><div class="cap-text" id="capText"></div></div>

  <div id="hook" class="overlay ml">
    <div class="em">🔄</div>
    <h1>ഹോംവർക്ക് തെറ്റിയാൽ<br><span>ഇനി വഴക്കുപറയേണ്ട!</span></h1>
    <div class="pill">💡 സ്നേഹത്തോടെ തിരുത്തിക്കാം 'Needs Revision' വഴി</div>
  </div>

  <div id="outro" class="overlay ml">
    <div class="box">
      <div class="lg">❤️</div>
      <h2>Positive Parenting Experience</h2>
      <div class="tag">Constructive Feedback · Habit-Building without Scolding</div>
      <div class="cta">ഡെമോ ഇന്നുതന്നെ പരിശോധിക്കൂ! 📲</div>
      <div class="url">🔗 kids-study-tracker-demo.web.app</div>
    </div>
  </div>

  <canvas id="confetti" width="540" height="960"></canvas>
</template>

<script>
  const W = 540, H = 960, DURATION = 15000;
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  let scale = 1, timers = [], t0 = 0, loop = false, rafClock = 0, confettiRaf = 0;

  function fit() {
    scale = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `scale(${scale})`;
  }
  addEventListener('resize', fit); fit();

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(confettiRaf);
    stage.innerHTML = $('tpl').innerHTML;
  }

  function posIn(el, anc) {
    let x = 0, y = 0, n = el;
    while (n && n !== anc) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 };
  }
  function moveTo(id, dy = 0) {
    const f = $('finger'), p = posIn($(id), $('screen'));
    f.style.left = p.x + 'px'; f.style.top = (p.y + dy) + 'px'; f.style.opacity = 1;
  }
  function tap() {
    const f = $('finger'); f.classList.remove('tap'); void f.offsetWidth; f.classList.add('tap');
  }
  function press(id) { const e = $(id); e.classList.add('press'); setTimeout(() => e.classList.remove('press'), 180); }
  function hideFinger() { $('finger').style.opacity = 0; }

  function showScreen(id) {
    document.querySelectorAll('.scr').forEach(s => {
      s.classList.toggle('active', s.id === id);
    });
  }
  function flow(n) {
    for (let i = 1; i <= 4; i++) {
      $('fs' + i).classList.toggle('on', i === n);
      $('fs' + i).classList.toggle('done', i < n);
      if (i < 4) $('ln' + i).classList.toggle('on', i < n);
    }
  }
  function setCap(step, text) {
    const c = $('caption'); c.classList.add('swap');
    setTimeout(() => { $('capStep').textContent = step; $('capText').textContent = text; c.classList.remove('swap'); }, 160);
  }

  function confetti() {
    const cv = $('confetti'), ctx = cv.getContext('2d');
    const colors = ['#10b981', '#34d399', '#facc15', '#38bdf8', '#ec4899', '#ffffff'];
    const ps = Array.from({ length: 160 }, () => ({
      x: W / 2 + (Math.random() - .5) * 80, y: 440,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5,
      s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
      c: colors[(Math.random() * colors.length) | 0]
    }));
    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(p => {
        p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (now - start < 3200) confettiRaf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(start);
  }

  function clock() {
    const t = Math.min((performance.now() - t0) / 1000, DURATION / 1000);
    const c = document.getElementById('clock'); if (c) c.textContent = t.toFixed(1) + 's';
    if (t < DURATION / 1000) rafClock = requestAnimationFrame(clock);
  }

  function play() {
    reset(); t0 = performance.now(); cancelAnimationFrame(rafClock); clock();

    /* 0.0 – 1.8s : HOOK */
    at(30, () => { $('hook').classList.add('show'); setCap('', 'ഹോംവർക്ക് തെറ്റിയാൽ ഇനി വഴക്കുപറയേണ്ട! 🔄'); });
    at(500, () => $('flow').classList.add('show'));

    /* 1.8 – 4.5s : STEP 1 – Child Login & Submit */
    at(1800, () => {
      $('hook').classList.remove('show'); $('phone').classList.add('show');
      showScreen('sLoginChild'); flow(1);
      setCap('STEP 1: CHILD LOGIN', 'കുട്ടി (Arjun) സ്വന്തം PIN 1234 നൽകി ലോഗിൻ ചെയ്യുന്നു 🧒');
    });
    at(2200, () => moveTo('btnSignChild'));
    at(2600, () => { tap(); press('btnSignChild'); });

    at(2900, () => {
      showScreen('sChildSubmit'); hideFinger();
      setCap('STUDENT SUBMISSION', 'ഹോംവർക്ക് പൂർത്തിയാക്കി കുട്ടി അപ്രൂവലിനായി അയക്കുന്നു 📬');
    });
    at(3300, () => moveTo('btnChildSubmit'));
    at(3800, () => {
      tap(); press('btnChildSubmit');
      $('btnChildSubmit').classList.add('submitted');
      $('btnChildSubmit').innerHTML = '<span>✓ Sent to Parent (Pending) ⏳</span>';
    });

    /* 4.5 – 7.8s : STEP 2 – Parent Login & Needs Revision Note */
    at(4500, () => {
      showScreen('sLoginParent'); flow(2); hideFinger();
      setCap('SWITCH TO PARENT', 'രക്ഷിതാവ് (Rajeev) PIN 9999 നൽകി ലോഗിൻ ചെയ്യുന്നു 👨‍👩‍👧');
    });
    at(4900, () => moveTo('btnSignParent'));
    at(5300, () => { tap(); press('btnSignParent'); });

    at(5600, () => {
      showScreen('sParentReview'); hideFinger();
      setCap('STEP 2: NEEDS REVISION', 'നോട്ട്ബുക്കിൽ വിട്ടുപോയ ചോദ്യം കണ്ട് സ്നേഹത്തോടെ കുറിപ്പ് നൽകുന്നു 💬');
    });
    at(6000, () => moveTo('btnNeedsRevision'));
    at(6400, () => {
      tap(); press('btnNeedsRevision');
      $('noteCard').style.display = 'block';
    });
    at(6900, () => moveTo('btnSendNote'));
    at(7400, () => {
      tap(); press('btnSendNote');
      $('btnSendNote').innerHTML = '<span>✓ Note Sent to Arjun! ❤️</span>';
    });

    /* 7.8 – 10.6s : STEP 3 – Child Sees Friendly Alert & Resubmits */
    at(7900, () => {
      showScreen('sChildAlert'); flow(3); hideFinger();
      setCap('STEP 3: CHILD CORRECTS', 'പോയിന്റുകൾ കുറയ്ക്കാതെ, തെറ്റ് തിരുത്തി വീണ്ടും അയക്കാൻ കുട്ടിക്ക് അവസരം 😊');
    });
    at(8600, () => moveTo('btnResubmit'));
    at(9200, () => {
      tap(); press('btnResubmit');
      $('btnResubmit').innerHTML = '<span>✓ Resubmitted to Parent 📬</span>';
    });

    /* 10.6 – 13.0s : STEP 4 – Parent Approves with Star & Confetti */
    at(10200, () => {
      showScreen('sParentApproved'); flow(4); hideFinger();
      setCap('APPROVED WITH STAR ⭐', 'തിരുത്തലുകൾ കണ്ട് സന്തോഷത്തോടെ പാരന്റ് അപ്രൂവ് ചെയ്യുന്നു! 🎉');
      confetti();
    });

    /* 13.0 – 15.0s : CTA */
    at(13000, () => { $('outro').classList.add('show'); setCap('', ''); });
    at(DURATION + 600, () => { if (loop) play(); });
  }

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r' || k === ' ') { e.preventDefault(); play(); }
    if (k === 'h') document.body.classList.toggle('rec');
    if (k === 'l') { loop = !loop; }
  });

  reset();
  setTimeout(play, 600);
</script>
</body>
</html>
