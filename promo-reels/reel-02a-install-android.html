          <div class="tabs"><div class="tab on">🔑 Sign In</div><div class="tab">🏡 Register Family</div></div>
          <div class="card">

  <div id="caption" class="ml"><div class="cap-step" id="capStep"></div><div class="cap-text" id="capText"></div></div>

  <div id="hook" class="overlay ml">
    <div class="platform">🤖 Android · Google Chrome</div>
    <div class="hrow">
      <div class="store"><div class="sic play"><span>▶</span></div><small>Play Store</small><div class="x">✕</div></div>
      <div class="harrow">➜</div>

    </div>

  </div>

  <div id="outro" class="overlay ml"><div class="box">
    <img src="../icons/icon-192.png" alt="">
    <h2>Kids Study &amp; Rewards Tracker</h2>
    <div class="tag">🌴 Kerala State &amp; 🏛️ CBSE · Classes 1–10</div>
    <div class="cta">ഇന്നുതന്നെ ഇൻസ്റ്റാൾ ചെയ്യൂ! 📲</div>
    <div class="url2">🔗 kids-study-tracker-demo.web.app</div>
    <div class="steps">Chrome → ⋮ → Install app</div>
  </div></div>

  <canvas id="confetti" width="540" height="960"></canvas>
</template>

<script>
  const W = 540, H = 960, DURATION = 15000;
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  let scale = 1, timers = [], t0 = 0, loop = false, rafClock = 0, confettiRaf = 0;

  function fit() { scale = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${scale})`; }
  addEventListener('resize', fit); fit();
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  function reset() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(confettiRaf); stage.innerHTML = $('tpl').innerHTML; }

  function posIn(el, anc) { let x = 0, y = 0, n = el; while (n && n !== anc) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 }; }
  function moveTo(id, dy = 0) { const f = $('finger'), p = posIn($(id), $('screen')); f.style.left = p.x + 'px'; f.style.top = (p.y + dy) + 'px'; f.style.opacity = 1; }
  function tap() { const f = $('finger'); f.classList.remove('tap'); void f.offsetWidth; f.classList.add('tap'); }
  function press(id) { const e = $(id); e.classList.add('press'); setTimeout(() => e.classList.remove('press'), 180); }
  function hideFinger() { $('finger').style.opacity = 0; }
  function layer(id) { ['home', 'browser', 'splash', 'appL'].forEach(l => $(l).classList.toggle('show', l === id)); }
  function sbar(mode) { $('sbar').className = 'sbar' + (mode ? ' ' + mode : ''); }
  function flow(n) { for (let i = 1; i <= 4; i++) { $('fs' + i).classList.toggle('on', i === n); $('fs' + i).classList.toggle('done', i < n); if (i < 4) $('ln' + i).classList.toggle('on', i < n); } }
  function setCap(step, text) { const c = $('caption'); c.classList.add('swap'); setTimeout(() => { $('capStep').textContent = step; $('capText').textContent = text; c.classList.remove('swap'); }, 170); }
  function type(id, text, start, step) { [...text].forEach((_, i) => at(start + i * step, () => { $(id).textContent = text.slice(0, i + 1); })); }

  function confetti() {
    const cv = $('confetti'), ctx = cv.getContext('2d');
    const colors = ['#facc15', '#22c55e', '#38bdf8', '#f472b6', '#a78bfa', '#fb923c', '#ffffff'];
    const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: 430, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5,
      s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[(Math.random() * colors.length) | 0] }));
    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (now - start < 3000) confettiRaf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(start);
  }
  function clock() { const t = Math.min((performance.now() - t0) / 1000, DURATION / 1000); const c = $('clock'); if (c) c.textContent = t.toFixed(1) + 's'; if (t < DURATION / 1000) rafClock = requestAnimationFrame(clock); }

  function play() {
    reset(); t0 = performance.now(); cancelAnimationFrame(rafClock); clock();

    /* 0.0 – 2.0s HOOK */
    at(30, () => { $('hook').classList.add('show'); setCap('', 'Play Store ഇല്ലാതെ തന്നെ ആപ്പ് ഇൻസ്റ്റാൾ ചെയ്യാം! 🤩'); });
    at(900, () => $('flow').classList.add('show'));

    /* 2.0 – 5.0s STEP 1: open in Chrome */
    at(2000, () => { $('hook').classList.remove('show'); $('phone').classList.add('show'); layer('home'); sbar(''); flow(1); setCap('ANDROID · STEP 1', 'Chrome-ൽ നമ്മുടെ സൈറ്റ് തുറക്കുക 🌐'); });
    at(2350, () => moveTo('chromeIcon'));
    at(2650, () => { tap(); press('chromeIcon'); });
    at(2800, () => { layer('browser'); sbar('dark'); });
    at(3100, () => moveTo('url'));
    at(3300, () => { tap(); $('url').classList.add('focus'); $('urlText').textContent = ''; });
    type('urlText', 'kids-study-tracker-demo.web.app', 3380, 28);
    at(4300, () => { $('url').classList.remove('focus'); $('lock').style.display = ''; $('prog').style.width = '100%'; hideFinger(); });
    at(4650, () => { $('ntp').style.opacity = 0; $('site').classList.add('in'); $('prog').style.opacity = 0; });

    /* 5.0 – 7.2s STEP 2: ⋮ menu → Install app */
    at(5000, () => { flow(2); setCap('ANDROID · STEP 2', 'മുകളിലെ ⋮ മെനുവിൽ "Install app" അമർത്തുക'); });
    at(5250, () => moveTo('btnMenu'));
    at(5550, () => { tap(); $('btnMenu').classList.add('tapbg'); });
    at(5650, () => { $('menu').classList.add('open'); $('btnMenu').classList.remove('tapbg'); });
    at(6050, () => moveTo('miInstall'));
    at(6300, () => $('miInstall').classList.add('hl'));
    at(6750, () => tap());
    at(6900, () => $('menu').classList.remove('open'));

    /* 7.2 – 9.0s STEP 3: Install dialog */
    at(7100, () => { $('dlg').classList.add('open'); flow(3); setCap('ANDROID · STEP 3', '"Install" ബട്ടൺ അമർത്തുക ✅'); });
    at(7550, () => moveTo('btnInstall'));
    at(8000, () => { tap(); press('btnInstall'); });
    at(8200, () => { $('dlg').classList.remove('open'); $('snack').classList.add('in'); hideFinger(); });

    /* 9.0 – 13.0s STEP 4: icon on home → open as app */
    at(9000, () => { layer('home'); sbar(''); flow(4); setCap('READY ✅', 'ഹോം സ്ക്രീനിൽ ആപ്പ് റെഡി! ഒറ്റ ടാപ്പിൽ തുറക്കാം 🎉'); });
    at(9350, () => { $('newApp').classList.add('in'); confetti(); });
    at(10300, () => moveTo('newIc'));
    at(10650, () => { tap(); press('newIc'); });
    at(10800, () => { layer('splash'); sbar('app'); hideFinger(); });
    at(11600, () => { layer('appL'); });

    /* 13.0 – 15.0s CTA */
    at(13000, () => { $('outro').classList.add('show'); setCap('', ''); });
    at(DURATION + 600, () => { if (loop) play(); });
  }

  addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'r' || k === ' ') { e.preventDefault(); play(); } if (k === 'h') document.body.classList.toggle('rec'); if (k === 'l') loop = !loop; });
  reset(); setTimeout(play, 700);
</script>
