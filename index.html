<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Study & Rewards Tracker — Kerala Syllabus</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/styles.css">
  <meta name="theme-color" content="#4f46e5">

  <!-- Apple iOS Mobile Web App Full Screen Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Study Tracker">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <script>
    (function() {
      var savedTheme = localStorage.getItem('study_tracker_theme') || 'indigo';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>

  <!-- Celebration Confetti Layer -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Dynamic Application Root -->
  <div id="app-root"></div>

  <!-- Dynamic Modal Overlay Container -->
  <div id="modal-container"></div>

  <!-- Firebase Cloud SDK & Config (Phase 2 Cloud Firestore & Auth) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>

  <!-- Scripts (Clean Modular Architecture) -->
  <script src="./js/syllabus.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/parent-dashboard.js"></script>
  <script src="./js/child-dashboard.js"></script>
  <script src="./js/admin-dashboard.js"></script>
  <script src="./js/app.js"></script>

  <!-- Progressive Web App Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('✅ ServiceWorker registered! Scope:', reg.scope);
          })
          .catch(function(err) {
            console.info('ServiceWorker registration deferred:', err);
          });
      });
    }
  </script>
</body>
</html>
